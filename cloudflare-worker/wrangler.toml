name = "ai-avtopilot-bot"
main = "worker.js"
compatibility_date = "2024-09-25"

# Enterprise Custom Domain Routing (Masks workers.dev subdomain completely)
routes = [
  { pattern = "ai-avtopilot.ru/submit", zone_name = "ai-avtopilot.ru" },
  { pattern = "www.ai-avtopilot.ru/submit", zone_name = "ai-avtopilot.ru" },
  { pattern = "ai-avtopilot.ru/status", zone_name = "ai-avtopilot.ru" }
]

# Daily synthetic site healthcheck (06:00 UTC / 09:00 MSK)
[triggers]
crons = ["0 6 * * *"]
