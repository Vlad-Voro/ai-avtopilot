name: Synthetic Health & SEO Verification

on:
  push:
    branches: [ main ]
  schedule:
    # Run daily at 06:00 UTC (09:00 MSK)
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: healthcheck
  cancel-in-progress: true

jobs:
  verify:
    name: SEO, Security & Resiliency Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Full Phase 1 Suite (SEO + Security + SSL + Resiliency)
        run: node tests/run_all.js --fast

      - name: Live Production Ping & Edge Status
        run: |
          echo "Checking https://ai-avtopilot.ru/ status and full download..."
          curl -v -m 20 -A "Mozilla/5.0 (HealthCheckBot)" https://ai-avtopilot.ru/ -o live_full.html
          SIZE=$(wc -c < live_full.html)
          echo "Downloaded size: $SIZE bytes"
          if [ "$SIZE" -lt 50000 ]; then
            echo "Error: Downloaded size too small ($SIZE bytes)!"
            exit 1
          fi
          curl -s -f -m 15 -A "Mozilla/5.0 (HealthCheckBot)" https://ai-avtopilot.ru/ -o live_page.html
          SIZE=$(wc -c < live_page.html)
          echo "Downloaded full live page: $SIZE bytes"
          if [ "$SIZE" -lt 50000 ]; then
            echo "Error: Page download was truncated ($SIZE bytes)!"
            exit 1
          fi

      - name: Alert Telegram on Failure
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$TG_BOT_TOKEN" ] && [ -n "$TG_ADMIN_ID" ]; then
            python3 -c '
          import urllib.request, json, os
          token = os.environ.get("TG_BOT_TOKEN")
          chat_id = os.environ.get("TG_ADMIN_ID")
          run_url = os.environ.get("RUN_URL")
          sha = os.environ.get("COMMIT_SHA", "")[:7]
          msg = f"🚨 *Ai-Avtopilot: Сбой синтетической верификации!*\n\n• *Коммит*: {sha}\n• *Лог*: {run_url}\n\n⚠️ Проверьте результаты тестов в GitHub Actions."
          data = json.dumps({"chat_id": chat_id, "text": msg, "parse_mode": "Markdown"}).encode("utf-8")
          try:
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req)
          except Exception as e:
              print("Telegram alert error:", e)
          '
          else
            echo "Notice: Telegram credentials not configured in repository secrets."
          fi
