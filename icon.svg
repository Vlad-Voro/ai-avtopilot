<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ap-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ap-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- Outer Hexagon Base -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="url(#ap-grad)" stroke-width="3" fill="#111119" fill-opacity="0.95"/>
  <!-- Inner Hexagon Accent -->
  <polygon points="32,16 46,24 46,40 32,48 18,40 18,24" fill="url(#ap-glow)" fill-opacity="0.35" stroke="url(#ap-grad)" stroke-width="1.5"/>
  <!-- Center Core Indicator -->
  <circle cx="32" cy="32" r="4.5" fill="#818cf8"/>
</svg>
