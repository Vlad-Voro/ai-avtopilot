<!DOCTYPE html>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: #08080c;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;

    .success-card {
      background: #111119;

      font-size: 2.2rem;

      margin-bottom: 1rem;
      color: #fff;
    }

    p {
      color: #a0a0ab;
      font-size: 1.05rem;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    a.btn {
      display: inline-block;
      padding: 14px 32px;
      background: #6366f1;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s;
    }

    a.btn:hover {
      background: #4f46e5;
    }

    .footer-link {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #6a6a7a;
    }

    .footer-link a {
      color: #9494a6;
      text-decoration: none;
    }

    .footer-link a:hover {
      text-decoration: underline;
